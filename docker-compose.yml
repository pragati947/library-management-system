version: '3.8'

services:
  # 1. MySQL 8.0 Database Service
  mysql:
    image: mysql:8.0
    container_name: library_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Pragzmysql321
      MYSQL_DATABASE: library_db
    ports:
      - "3307:3306" # Mapped to 3307 on host to avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/02_sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pPragzmysql321"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:Pragzmysql321@mysql:3306/library_db
      FALLBACK_TO_SQLITE: "True"
      SECRET_KEY: supersecretjwtkey_for_intelligent_library_management_system_2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      DEFAULT_DAILY_FINE_RATE: 5.00
      DEFAULT_BORROW_DAYS: 14
    ports:
      - "8000:8000"

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: library_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:

